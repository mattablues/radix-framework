name: Infection (scheduled)

on:
  schedule:
    - cron: "0 6 * * 1" # måndagar 06:00 UTC
  workflow_dispatch:

jobs:
  infection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP (with Xdebug)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pre-check PHPUnit for Infection (deterministic)
        env:
          XDEBUG_MODE: coverage
        run: |
          vendor/bin/phpunit -c phpunit.xml --display-deprecations --display-errors --display-notices --colors=never --order-by=default --do-not-cache-result

      - name: Generate coverage for Infection
        env:
          XDEBUG_MODE: coverage
        run: |
          rm -rf build/coverage || true
          mkdir -p build/coverage
          vendor/bin/phpunit \
            -c phpunit.xml \
            --order-by=default \
            --do-not-cache-result \
            --coverage-xml=build/coverage/coverage-xml \
            --log-junit=build/coverage/junit.xml

      - name: Run Infection (use pre-generated coverage)
        run: |
          php vendor/bin/infection \
            --configuration=infection.json.dist \
            --threads=1 \
            --skip-initial-tests \
            --coverage=build/coverage \
            --logger-html=infection-report.html \
            --no-interaction \
            --no-progress

      - name: Upload Infection report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-report
          path: infection-report.html
          if-no-files-found: warn
