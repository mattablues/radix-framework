name: Infection (scheduled)

on:
  schedule:
    - cron: "0 6 * * 1" # måndagar 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest
    env:
      RADIX_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP (with Xdebug)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pre-check PHPUnit for Infection
        env:
          XDEBUG_MODE: coverage
          APP_ENV: development
        run: |
          vendor/bin/phpunit -c phpunit.xml \
            --display-deprecations \
            --display-errors \
            --display-notices \
            --colors=never \
            --order-by=default \
            --do-not-cache-result

      - name: Generate coverage for Infection
        env:
          XDEBUG_MODE: coverage
        run: |
          rm -rf build/coverage || true
          mkdir -p build/coverage
          vendor/bin/phpunit \
            -c phpunit.xml \
            --order-by=default \
            --do-not-cache-result \
            --coverage-xml=build/coverage/coverage-xml \
            --log-junit=build/coverage/junit.xml

      - name: Clear Infection cache
        run: |
          rm -rf .infection || true
          rm -rf var/cache || true

      - name: Run Infection (with loggers)
        env:
          XDEBUG_MODE: coverage
          APP_ENV: development
        run: |
          php vendor/bin/infection \
            --configuration=infection.json.dist \
            --threads=1 \
            --skip-initial-tests \
            --coverage=build/coverage \
            --logger-html=infection-report.html \
            --logger-text=infection-report.txt \
            --logger-summary-json=infection-summary.json \
            --log-verbosity=all \
            --no-interaction \
            --no-progress

      - name: Show generated report files
        if: always()
        run: |
          echo "PWD: $(pwd)"
          ls -la
          ls -la infection-report.html || true
          ls -la infection-report.txt || true
          ls -la infection-summary.json || true

      - name: Upload Infection reports (HTML + TXT + summary JSON)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: infection-report
          path: |
            infection-report.html
            infection-report.txt
            infection-summary.json
          if-no-files-found: warn
